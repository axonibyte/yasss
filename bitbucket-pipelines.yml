image: atlassian/default-image:4

mirror: &mirror
  name: mirror repo
  clone:
    enabled: false
  script:
    - git clone --mirror git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git
    - cd ${BITBUCKET_REPO_SLUG}.git
    - git push --mirror git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

# Unit, component and browser tests. Runs on the Playwright image so the
# browsers and their system libraries are already present -- installing them
# into the JDK image on every build is minutes of wasted wall clock.
frontend: &frontend
  name: frontend tests
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  caches:
    - npm
  script:
    - cd frontend
    - npm ci
    - npm run test
    - npm run build
    - npm run test:e2e
    # The @compat subset on Firefox, WebKit and a mobile viewport. The image
    # already carries all three, so this costs about a minute.
    - npm run test:e2e:compat
  artifacts:
    - frontend/playwright-report/**

build: &build
  name: build and test artifacts
  image:
    name: registry.digitalocean.com/axb/openjdk17:latest
    username: $DO_REG_SECRET
    password: $DO_REG_SECRET
  caches:
    - gradle
    - npm
  script:
    # `check` rather than `test`: it runs the Java suite and the frontend unit
    # tests. The browser suite is its own step above so this one stays quick.
    - bash ./gradlew clean check shadowJar --info
  artifacts:
    - build/libs/*.jar

publish: &publish
  name: publish artifact
  clone:
    enabled: false
  script:
    - >-
      for f in build/libs/*.jar; do
        sha256sum $f | awk '{ print $1 }' > ${f}.sha256
        curl -sS --fail-with-body \
            -H "Authorization: Bearer ${BB_PUB_SECRET}" \
            -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
            --form files=@"${f}" --form files=@"${f}.sha256"
        echo "uploaded $f + checksum"
      done

definitions:
  caches:
    npm: frontend/node_modules

pipelines:
  branches:
    '**':
      - step:
          <<: *mirror
      # Previously only `main` built anything, so a branch could never be shown
      # to be green before merging -- which is how a frontend that had never
      # been executed once reached a release branch.
      - parallel:
          - step:
              <<: *frontend
          - step:
              <<: *build
    main:
      - step:
          <<: *mirror
      - parallel:
          - step:
              <<: *frontend
          - step:
              <<: *build
      - step:
          <<: *publish
  tags:
    '**':
      - step:
          <<: *mirror
