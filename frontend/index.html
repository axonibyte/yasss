<!DOCTYPE html>
<!--
  No theme class is pinned. app.scss emits Bulma's light variables into :root
  and its dark ones behind prefers-color-scheme, so the page follows the
  reader's OS setting. The legacy pinned `theme-light` because it shipped all
  of Bulma and had no say in what that emitted.
  See docs/legacy/02-aesthetics.md §5 and docs/rewrite-deltas.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yasss!</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      reCAPTCHA is NOT loaded here. The legacy shell loaded it unconditionally
      even when the server reported CAPTCHA disabled, which left anonymous
      publish/RSVP/register dead in a CAPTCHA-disabled deployment. It is now
      loaded on demand by lib/captcha.js, only when GET /v1 reports a site key.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
