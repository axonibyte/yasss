plugins {
  id "com.github.johnrengelman.shadow" version "8.1.1"
  id "com.github.node-gradle.node" version "7.1.0"
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

repositories {
  // jcenter is sunset and read-only; a cold cache is one policy change away
  // from an unbuildable repo.
  mavenCentral()
  maven {
    url "https://jitpack.io"
  }
}

group = prjGroup
version = prjVer
sourceCompatibility = prjCompat
targetCompatibility = prjCompat

dependencies {
  implementation 'com.stripe:stripe-java:28.0.1'
  // WebAuthn, confined to PasskeyVerifier so the swap is one file if it ever needs to be.
  // Chosen over Yubico's java-webauthn-server for two reasons that outweigh the size
  // difference: Yubico's published metadata declares its runtime dependencies without
  // versions, deferring to a parent that pins them as open ranges, so two builds of one
  // commit can ship different Jackson -- which this project already treats as a defect,
  // see npmInstallCommand below. And it requires implementing a CredentialRepository that
  // it calls into from inside the ceremony, which fights a model layer of static finders.
  // webauthn4j's verify() is a pure function of what it is handed, like SessionTicket.
  implementation 'com.webauthn4j:webauthn4j-core:0.31.9.RELEASE'
  implementation 'org.bitbucket.axonibyte:axb-lib-auth-java:0.2.0'
  implementation 'org.bitbucket.axonibyte:axb-lib-cfg-java:0.0.2'
  implementation 'org.bitbucket.axonibyte:axb-lib-db-java:0.5.1'
  implementation 'org.bitbucket.axonibyte:axb-lib-http-java:0.6.0'
  implementation 'org.json:json:20231013'
  implementation 'org.simplejavamail:simple-java-mail:8.12.2'
  implementation 'org.slf4j:slf4j-simple:2.0.9'
  // EasyMock 4.3 cannot proxy classes on JDK 17+; 5.x can. PowerMock is dropped
  // outright -- it was referenced by nothing, and its last release predates the
  // JDK this project targets.
  testImplementation 'org.easymock:easymock:5.6.0'
  testImplementation 'org.testng:testng:7.11.0'
}

node {
  // Vitest 4 dropped Node 18. Keep this in sync with frontend/.nvmrc and the
  // "engines" field in frontend/package.json.
  version = '22.20.0'
  download = true
  nodeProjectDir = file("${project.projectDir}/frontend")

  // `npm ci` rather than `npm install`, matching what CI runs. Every frontend
  // dependency is declared with a caret range, so `install` is free to resolve
  // differently from the lockfile -- which meant the bundle shipped in the jar
  // could be built from versions nothing had tested.
  //
  // This is the plugin's own setting. Setting `npmInstall { args = ['ci'] }`
  // does NOT work: the task appends args to `npm install`, so it runs
  // `npm install ci` and cheerfully installs a package named "ci".
  npmInstallCommand = 'ci'
}

task buildFrontend(type: NpmTask) {
  args = ['run', 'build']
  execOverrides {
    it.workingDir = file("${project.projectDir}/frontend")
  }
}

task testFrontend(type: NpmTask) {
  args = ['run', 'test']
  execOverrides {
    it.workingDir = file("${project.projectDir}/frontend")
  }
}
testFrontend.dependsOn npmInstall

buildFrontend.dependsOn npmInstall
processResources.dependsOn buildFrontend

// Editor backups sit next to the migrations in src/main/resources/db, and
// Database.setup executes every script it finds there -- so a stray `*.sql~`
// in a developer's tree is not merely untidy, it is a migration.
processResources {
  exclude '**/*~'
  exclude '**/#*#'
}

// The Java suite never actually ran: TestNG is on the classpath but was never
// activated, so `gradle test` silently executed zero tests.
test {
  useTestNG()
}

// `gradle check` runs both tiers. Playwright is deliberately excluded — it is
// its own CI step so `gradle build` stays fast.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }

// Re-runs the credential interop vectors under a default charset that is not UTF-8.
// One of those vectors signs {"email":"jos\u00e9@example.com","mfa":""} as raw JSON, so
// it exercises AuthToken's decode and Credentialed.verifySig on a non-ASCII string --
// the path that silently rejected such an account on a non-UTF-8 host. Under a UTF-8
// default it passes whether or not the charsets are pinned, so the ordinary run cannot
// fail for the right reason.
//
// A filter rather than a suite file, because `test` here uses no suite XML.
tasks.register('charsetTest', Test) {
  description = 'Re-runs the credential interop vectors under a non-UTF-8 default charset.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useTestNG()
  filter { includeTestsMatching 'com.crowdease.yasss.api.CredentialInteropTest' }
  jvmArgs '-Dfile.encoding=US-ASCII', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

check.dependsOn testFrontend
check.dependsOn charsetTest

eclipse {
  classpath {
    downloadJavadoc = true
    downloadSources = true
  }
}

// Byte-for-byte identical output for an identical tree.
//
// Zip entries carry a modification time and an arbitrary directory order, so
// two builds of the same commit produced two different files and two different
// checksums. That made a question worth answering unanswerable: "is the jar on
// the downloads page the one built from this commit?" could only ever be taken
// on trust, because rebuilding and comparing proved nothing.
//
// With these, the sha256 published beside the artefact becomes a claim anybody
// can check by building the tag themselves. It is also what lets a merge queue
// mean something: the queue validates a merge result, `main` rebuilds after the
// merge, and only reproducibility makes those two the same jar rather than two
// jars from the same source.
//
// `filePermissions`/`dirPermissions` are pinned for the same reason -- the
// default depends on the builder's umask, and e2e/run.sh sets `umask 000` in
// CI.
def makeReproducible = { task ->
  task.preserveFileTimestamps = false
  task.reproducibleFileOrder = true
  task.filePermissions { unix(0644) }
  task.dirPermissions { unix(0755) }
}

jar {
  makeReproducible(delegate)

  manifest {
    attributes(
      'Main-Class': prjGroup + '.' + prjMain,
      // What is actually running. The jar deliberately keeps a fixed name --
      // `archiveVersion.set('')` below, because the artefact name is a deploy
      // contract and e2e/run.sh and the Containerfile both depend on it -- so
      // the manifest is the only place the build can identify itself. Without
      // it there was nothing on a running system that said which build it was,
      // and "did the deploy land" could only be answered by comparing hashes.
      'Implementation-Title': prjName,
      'Implementation-Version': prjVer,
    )
  }
}

shadowJar {
  makeReproducible(delegate)

  archiveBaseName.set(prjName)
  archiveClassifier.set('')
  archiveVersion.set('')

  // Without this, colliding META-INF/services files are overwritten rather than
  // merged and only one survives per interface. gRPC discovers its name
  // resolvers and load balancers exactly that way, and reCAPTCHA Enterprise --
  // the only consumer -- is reached through gRPC. The registries in the built
  // jar had one entry each, so CAPTCHA verification would have failed in the
  // shadow jar and nowhere else. No suite caught it because both shipped
  // configs disable CAPTCHA.
  mergeServiceFiles()
}

artifacts {
  archives shadowJar
}
